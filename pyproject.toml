[project]
name = "nexus-rag"
version = "0.1.0"
description = "多文档智能问答系统 — FastAPI + PostgreSQL/pgvector + Next.js"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "jieba>=0.42.1",
    "colbert-ai>=0.2.22",
    "transformers>=4.46,<5",
]

[project.scripts]
serve = "src.api.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 tests/ 里的 `from src...` 无需打包安装即可导入（项目不是 package，uv 会警告）
pythonpath = ["."]
